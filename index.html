let mouseReturn='play';function clearInput(){keys={};mouseFire=false;aim=false;lastMX=null;lastMY=null;justE=false;p.jumpBuffer=0;closeWheel(false)}function releaseMouse(){wantsLock=false;freeLook=false;clearInput();try{if(document.pointerLockElement)document.exitPointerLock()}catch(e){}}function inputReady(){mode=mouseReturn;hide('mousehelp');if(mode==='travel'){show('travel');$('travel').classList.remove('open');travelT=0;sound(100,1.2,.13,'sawtooth',50)}}function mouseFailure(){if(locked||mode!=='mouse')return;wantsLock=false;$('mousereason').textContent='Браузер отклонил настоящий захват. Встроенный предпросмотр может запрещать Pointer Lock. Скачайте HTML и откройте напрямую в браузере. Резервный режим ограничен границами окна.';show('mousehelp')}function requestMouse(next='play'){mouseReturn=next;if(locked){inputReady();return}mode='mouse';wantsLock=true;freeLook=false;clearInput();show('mousehelp');$('mousereason').textContent='Запрашивается настоящий захват. Разрешите его, если браузер спросит. Курсор должен исчезнуть, камера — вращаться без границ окна.';initAudio();try{window.focus();canvas.focus({preventScroll:true});if(!canvas.requestPointerLock){mouseFailure();return}let ret=canvas.requestPointerLock();if(ret&&ret.catch)ret.catch(mouseFailure);setTimeout(()=>{if(wantsLock&&!locked)mouseFailure()},1300)}catch(e){mouseFailure()}}
function walkHub(){hide('home');show('hud');updateHUD(null);requestMouse()}function pause(){if(!['play','mouse','travel'].includes(mode))return;if(mode==='travel'){p.foot=0;p.y=1.7;hide('travel')}mode='pause';releaseMouse();hide('mousehelp');show('pause')}function resume(){for(let id of ['pause','inventory','corpse','mapoverlay'])hide(id);show('hud');requestMouse()}function openBag(){if(world==='hub'){openHome('stash');return}if(mode==='bag'){resume();return}if(mode!=='play')return;mode='bag';releaseMouse();bagUI();show('inventory')}function returnHub(){mode='home';releaseMouse();for(let id of ['hud','result','pause','inventory','corpse','settings','mousehelp','extract','hint','travel','appearance','mapoverlay'])hide(id);$('subtitle').textContent='';$('hurt').style.opacity=0;show('shade');makeHub();openHome()}
function deploy(){if(world!=='hub')return;let training=maps[selectedMap].practice,taken={};for(let t of Object.keys(prices)){taken[t]=training?5:Math.min(profile.load[t],profile.stock[t]);if(!training)profile.stock[t]-=taken[t]}if(!training)profile.runs++;let packed=training?[]:profile.packed.splice(0);profile.map=selectedMap;profile.weather=selectedWeather;profile.hour=selectedHour;save();makeMap(selectedMap);p=fresh();p.supplies={...taken,med:1+taken.med,shield:1+taken.shield};p.bag=packed;for(let it of packed){if(it.kind==='weapon')equipWeapon(it);if(it.kind==='armor')p.shieldMax=Math.max(p.shieldMax,it.max)}p.shield=p.shieldMax;p.x=maps[selectedMap].spawn[0];p.z=maps[selectedMap].spawn[1];p.foot=-3;p.y=-1.3;weatherIndex=selectedWeather;raidHour=selectedHour;simTime=0;raidTime=0;spawnTimer=40;stormTimer=18;strike=null;weatherFlash=0;extraction=null;scanner=0;scanCD=0;recoil=0;hurt=0;hit=0;flash=0;ads=0;gesture=0;target=null;clearInput();hide('home');show('hud');$('notices').innerHTML='';$('traveltitle').textContent=maps[selectedMap].name+' / '+weatherModes[weatherIndex].name;requestMouse('travel')}
function updateTravel(dt){travelT+=dt;p.foot=-3*(1-clamp(travelT/2.5,0,1));p.y=p.foot+p.eye;if(travelT>2.3)$('travel').classList.add('open');if(travelT>3.2){hide('travel');mode='play';p.foot=0;p.y=1.7;updateHUD(null);notice('X — смена плеча · V — FPS/TPS · B — сканер.');notice(weatherModes[weatherIndex].name+' / '+raidHour+':00 · '+maps[mapIndex].name)}}
function finish(ok,desc=''){if(mode!=='play'||world!=='surface')return;if(p.gunItem)p.gunItem.mag=p.mag;let training=!!maps[mapIndex].practice,extracted=ok&&!training?p.bag.filter(i=>!i.core):[],core=ok&&!training&&p.bag.some(i=>i.core),bonus=core?900:0,combat=ok&&!training?p.kills*20:0,overflow=0;if(ok&&!training){profile.wins++;profile.tokens+=core?2:1;profile.credits+=bonus+combat;for(let it of extracted)if(profile.stash.length<profile.stashMax)profile.stash.push({...it});else{profile.credits+=it.value;overflow+=it.value}for(let t of Object.keys(prices))profile.stock[t]+=p.supplies[t]}save();mode='result';releaseMouse();for(let id of ['hud','inventory','corpse','pause','mousehelp','travel','mapoverlay'])hide(id);$('hurt').style.opacity=0;show('result');$('resultlabel').textContent=training?'ТРЕНИРОВКА ЗАВЕРШЕНА':ok?'ПОВЕРХНОСТЬ ПОКИНУТА':'КОНТАКТ ПОТЕРЯН';$('resulttitle').textContent=training?'ДО ВСТРЕЧИ НА ПОЛИГОНЕ.':ok?'ДОБРО ПОЖАЛОВАТЬ ДОМОЙ.':'РЕЙД ЗАВЕРШЁН.';$('resultdesc').textContent=training?'Тренировочное снаряжение не влияет на экономику убежища.':ok?'Добыча, оружие и щиты отправлены на склад.'+(overflow?' Переполнение продано: '+overflow+' ¤.':''):desc;$('resultstats').innerHTML='<div class="row"><span>Карта / погода</span><span>'+maps[mapIndex].name+' / '+weatherModes[weatherIndex].name+'</span></div><div class="row"><span>Целей уничтожено отрядом</span><span>'+p.kills+'</span></div><div class="row"><span>Предметов на склад</span><span>'+extracted.length+'</span></div><div class="row"><span>Контракт + бой</span><span class="num">+'+(bonus+combat)+' ¤</span></div>';sound(ok?500:100,1,.17,'triangle',ok?1000:40)}
$('walkhub').onclick=walkHub;$('resume').onclick=resume;$('closebag').onclick=resume;$('backhome').onclick=returnHub;$('takeall').onclick=takeCorpseAll;$('closecorpse').onclick=resume;$('lockbtn').onclick=()=>requestMouse(mouseReturn);$('freebtn').onclick=()=>{freeLook=true;wantsLock=false;clearInput();inputReady();notice('Резервный обзор: курсор НЕ захвачен. Откройте HTML отдельно.')};$('mousepause').onclick=pause;$('abandon').onclick=()=>{hide('pause');if(world==='hub'){openHome();return}mode='play';finish(false,'Вы прервали рейд. Рюкзак и взятые расходники утрачены.')};$('settingsbtn').onclick=()=>show('settings');$('pauseconfig').onclick=()=>show('settings');$('closeconfig').onclick=()=>hide('settings');$('quality').onchange=e=>{opts.quality=e.target.value;resize()};$('volume').oninput=e=>{opts.volume=e.target.value/100;if(master)master.gain.value=opts.volume};$('sensitivity').oninput=e=>opts.sens=e.target.value*.00003;$('shadows').onchange=e=>opts.shadows=e.target.checked;$('voice').onchange=e=>opts.voice=e.target.checked;$('lookbtn').onclick=openAppearance;$('closelook').onclick=closeAppearance;$('closemap').onclick=closeMap;$('clearmarker').onclick=()=>{waypoint=null;drawMap(true)};
function swapShoulder(){side*=-1;if(viewMode==='fps')viewMode='tps';profile.camera=viewMode;save();notice('Камера: '+(side>0?'правое':'левое')+' плечо · V — первое лицо')}function toggleView(){viewMode=viewMode==='fps'?'tps':'fps';profile.camera=viewMode;save();notice(viewMode==='fps'?'Камера: первое лицо':'Камера: третье лицо · X сменить плечо')}
addEventListener('keydown',e=>{if(['Tab','Space','ControlLeft'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.repeat)return;if(e.code==='Escape'){if(!$('settings').classList.contains('hidden'))hide('settings');else if(mode==='appearance')closeAppearance();else if(mode==='map')closeMap();else if(wheel)closeWheel(false);else if(['play','mouse','travel'].includes(mode))pause();else if(['pause','bag','corpse'].includes(mode))resume();return}if(mode==='corpse'&&(e.code==='KeyE'||e.code==='Tab')){resume();return}if(e.code==='KeyM'&&['play','home','map'].includes(mode)){openMap();return}if(e.code==='Tab'&&['play','bag'].includes(mode)){openBag();return}if(mode!=='play')return;if(e.code==='Space')p.jumpBuffer=.18;if(e.code==='KeyE')justE=true;if(e.code==='KeyQ')openWheel('Q');if(e.code==='KeyG')openWheel('G');if(e.code==='KeyC'||e.code==='ControlLeft')trySlide();if(e.code==='KeyR')reload();if(e.code==='KeyH')useItem('med');if(e.code==='KeyB')impulse();if(e.code==='KeyX')swapShoulder();if(e.code==='KeyV')toggleView();if(e.code==='Digit1'){setTool('gun');p.hook=null;p.ride=null}if(e.code==='KeyF'){p.flashlight=!p.flashlight;sound(850,.04,.03,'square')}});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='KeyQ'&&wheel==='Q'||e.code==='KeyG'&&wheel==='G')closeWheel(true)});addEventListener('blur',()=>{clearInput();if(['play','travel'].includes(mode))pause()});document.addEventListener('pointerlockchange',()=>{let was=locked;locked=document.pointerLockElement===canvas;if(locked){wantsLock=false;freeLook=false;if(mode==='mouse')inputReady();lastMX=null;lastMY=null}else if(was&&['play','travel'].includes(mode))pause()});document.addEventListener('pointerlockerror',mouseFailure);
canvas.addEventListener('mousedown',e=>{if(e.button===1)e.preventDefault();if(mode!=='play'||wheel)return;if(!locked&&!freeLook){requestMouse();return}if(e.button===1){pingCommand();return}if(e.button===0)mouseFire=true;if(e.button===2&&p.slide<=0&&p.tool==='gun')aim=true});canvas.addEventListener('auxclick',e=>{if(e.button===1)e.preventDefault()});addEventListener('mouseup',e=>{if(e.button===0)mouseFire=false;if(e.button===2)aim=false});addEventListener('contextmenu',e=>{if(['play','mouse','pause','bag','corpse'].includes(mode))e.preventDefault()});addEventListener('mousemove',e=>{if(mode!=='play'||!locked&&!freeLook){lastMX=e.clientX;lastMY=e.clientY;return}let dx=locked?e.movementX:lastMX===null?0:e.clientX-lastMX,dy=locked?e.movementY:lastMY===null?0:e.clientY-lastMY;if(wheel){wheelX+=dx*.85;wheelY+=dy*.85;let len=Math.hypot(wheelX,wheelY);if(len>230){wheelX*=230/len;wheelY*=230/len}drawWheel()}else{let s=opts.sens*(1-ads*.45);p.yaw+=clamp(dx,-220,220)*s;p.pitch=clamp(p.pitch-clamp(dy,-220,220)*s,-1.45,1.45)}lastMX=e.clientX;lastMY=e.clientY});canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();pause();report('WebGL-контекст потерян. Перезагрузите HTML и выберите экономное качество.')});
function loop(t){let dt=Math.min(.04,Math.max(0,(t-last)/1000));last=t;try{if(mode==='play')update(dt);else if(mode==='travel')updateTravel(dt);render(dt)}catch(e){report(e);if(['play','travel'].includes(mode))pause()}requestAnimationFrame(loop)}makeHub();renderHome();show('home');requestAnimationFrame(loop);
